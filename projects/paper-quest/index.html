 {title:'唤醒外部知识',short:'知识之门',world:'RAG',enemy:'幻觉史莱姆',time:4,tag:'01 / THE KNOWLEDGE GATE',source:'rag',section:'摘要、§1、图 1',goal:'分清模型记住的知识，与查询时找来的证据。',terms:[['RAG','Retrieval-Augmented Generation','检索增强生成：让外部资料参与回答。'],['参数记忆','Parametric memory','存放在模型参数里的知识。'],['非参数记忆','Non-parametric memory','原论文中指可检索的文档索引。'],['幻觉','Hallucination','听起来合理，实际上缺乏事实支持。']],insight:'原论文把检索与生成结合，并研究训练。小游戏里的本地资料卡只是帮助理解的简化模型。',quiz:Q('星港图书馆刚改了开放时间。模型的训练数据还没更新，该怎么回答？',['只凭模型印象，写得自信一些','查询当前公告，再据此作答','增加回答长度，补上更多细节'],1,['表达自信不会更新知识。','对。外部知识能被更新和检索，不必先把新公告训练进模型。','更长的回答不等于有事实依据。']),scenario:Q('公告库只有两条记录。今天图书馆几点关门？',[ '18:00，因为旧公告这么说','20:00，依据当前公告 A2','24:00，夜间应该也开放'],1,['你引用了已被替代的旧公告。请检查适用日期。','证据链成立：当前公告 A2 → 20:00。你击破了“凭印象回答”。','资料中没有 24:00，不能从“夜间”推测。']),lesson:'把最新政策、产品手册或私人笔记接入助手时，就会遇到这个问题。',transfer:'项目动作：让 search_notes 返回片段和来源，答案依据命中内容生成。'},
 {title:'训练你的检索雷达',short:'检索雷达',world:'RAG',enemy:'噪声石像',time:5,tag:'02 / THE RETRIEVAL RADAR',source:'rag',section:'§2.2 Retriever、§2.3 Generator',goal:'理解检索器找资料，生成器组织回答。',terms:[['检索器','Retriever','按问题寻找相关文档片段。'],['DPR','Dense Passage Retriever','原论文采用的稠密检索器。'],['Top-K','Top-K passages','取得分最高的 K 个候选片段。'],['BART','Generator','原论文采用的序列到序列生成模型。']],insight:'论文用向量内积检索；下方雷达用关键词计分演示。它不是 DPR，也没有调用任何模型。',quiz:Q('在原始 RAG 的组件分工中，哪一组对应正确？',['DPR 负责生成，BART 负责建搜索索引','DPR 负责检索，BART 负责生成','Top-K 是一种让模型永久记住文档的训练方式'],1,['检索器和生成器的职责反了。','正确。找到相关资料，与组织成回答，是两个不同职责。','Top-K 是检索结果的截取数量，不是永久记忆。']),scenario:Q('用户问“机器人借阅需要押金吗？”哪条片段最适合传给生成器？',['D1：图书馆开放时间为 09:00—20:00','D3：机器人借阅须缴纳 200 星币押金','D4：食堂每周推出新菜单'],1,['同属图书馆场景，但并未回答押金问题。','命中了实体和所问属性。生成时可据 D3 回答 200 星币。','无关信息会挤占上下文，甚至干扰回答。']),lesson:'文档找错了，再强的生成模型也可能答偏。',transfer:'项目动作：单独查看检索命中，不要只调最终回答提示词。'},
 {title:'两种生成的岔路',short:'生成岔路',world:'RAG',enemy:'概率双生兽',time:6,tag:'03 / TWO PATHS OF GENERATION',source:'rag',section:'§2.1 Models，两个概率公式',goal:'抓住 RAG-Sequence 和 RAG-Token 的真正区别。',terms:[['Token','生成单位','模型逐步产生的词元，不一定等于一个汉字。'],['RAG-Sequence','序列级边缘化','先算每篇文档下整个答案的概率，再加权求和。'],['RAG-Token','词元级边缘化','每个生成位置先混合文档条件概率，再连乘。'],['边缘化','Marginalization','把不同文档的可能贡献按权重合起来。']],insight:'不是“Sequence 只检索一篇、Token 每步重新搜网”。两者都可用 Top-K 候选，区别在概率组合的位置。',quiz:Q('下面哪句话准确描述论文里的差别？',['Sequence 先在整段答案层面混合；Token 在每个生成位置混合','Sequence 只能查一篇；Token 可以查两篇','Token 每生成一个字，就必须重新调用检索器'],0,['正确。观察下方玩具计算：先乘后加，与先加后乘，结果可以不同。','Sequence 也会对多个候选文档边缘化。','原论文的 RAG-Token 不要求每个 token 都重新检索。']),scenario:Q('把 A 的检索权重调到 0.50。下方这组玩具概率得到什么？',['Sequence = 0.25；Token = 0.09','两种方法都必然等于 0.50','Sequence = 0.09；Token = 0.25'],2,['你把先乘后加、先加后乘的结果反过来了。','权重 0.50 不是完整答案的生成概率。','对。这个例子只展示组合差别，不说明 Token 在所有任务中都更好。']),lesson:'同样的检索候选，可以采用不同的生成建模方式。',transfer:'项目动作：把教学版“片段拼进提示词”与原论文的概率模型区分开。'},
 {title:'证据审计站',short:'证据审计',world:'RAG',enemy:'断言守卫',time:4,tag:'04 / THE EVIDENCE CHECKPOINT',source:'rag',section:'§2.4 Training；§3–4 Experiments / Results',goal:'别把检索成功，误当成回答可靠。',terms:[['检索失败','Retrieval failure','所需证据没有进入候选结果。'],['生成失败','Generation failure','证据已经找到，回答却没有正确使用。'],['端到端微调','Joint fine-tuning','原论文更新查询编码器与 BART，保持文档编码器和索引固定。'],['评估','Evaluation','用任务结果判断效果；不是看文字是否流畅。']],insight:'以下来源核验和拒答规则是本游戏的工程练习，不代表原论文保证自动引用或彻底消除幻觉。',quiz:Q('检索已返回“机器人押金 200 星币”，助手却回答“100 星币”。先查哪里？',['先查生成阶段是否正确使用证据','删除全部文档，重新训练一切','认定检索失败，因为答案不对'],0,['正确。先定位哪一段证据链出了问题。','这会引入额外成本，也没有定位当前故障。','检索已命中正确证据，应先审查生成。']),scenario:Q('当前命中资料仅说“机器人可外借”，用户问“遗失赔偿多少？”你会给哪个结论？',['确定赔偿 200，因为押金也许是 200','现有片段没有赔偿金额，需要补查赔偿规则','只要加上文件引用，任何金额都可信'],1,['押金与遗失赔偿是不同属性，不能互相替代。','正确。承认缺口，再补充检索，比用相关但不足的资料硬答更可靠。','引用存在不代表引用内容支持结论。']),lesson:'客服、制度问答、科研助手，都要区分“找到了东西”和“找到了答案依据”。',transfer:'项目动作：同时保留问题、检索结果、最终答案，逐段排查。'},
 {title:'启动行动引擎',short:'行动引擎',world:'ReAct',enemy:'空想幽灵',time:4,tag:'05 / THE ACTION ENGINE',source:'react',section:'§2 ReAct；图 1',goal:'分清判断、真实行动与外部反馈。',terms:[['Thought','判断 / 计划','帮助组织下一步，不会自己改变外部环境。'],['Action','行动','向环境或工具发出可执行操作。'],['Observation','观察','环境或工具返回的实际反馈。'],['Trajectory','行动轨迹','一连串判断、操作与反馈。']],insight:'本游戏展示的是手写教学行动摘要，不是实际模型的隐藏思维。ReAct 的价值在于把判断与行动、反馈联系起来。',quiz:Q('哪一项属于 Observation？',['“我需要先找创办者”','“执行 search[星港书院]”','工具返回“星港书院由林岚创办”'],2,['这是行动前的判断。','这是 Action；还没包含工具返回值。','对。Observation 来自实际执行反馈，不能凭空编造。']),scenario:Q('机器人要把书放到空书架上，搜索工具却返回“目标书架已满”。下一步？',['继续宣称“已放到空书架”','更新判断，寻找另一个有空位的书架','忽略反馈，重复同一句计划'],1,['计划不是执行结果，反馈已经否定原前提。','对。让观察改变下一步行动，才形成闭环。','不根据反馈调整，会陷入重复和失败。']),lesson:'一个会写行动计划的聊天机器人，还不等于会观察并调整的 Agent。',transfer:'项目动作：tools 执行后回到模型节点，把真实 ToolMessage 交回去。'},
 {title:'追踪两跳线索',short:'两跳追踪',world:'ReAct',enemy:'线索迷宫',time:5,tag:'06 / THE TWO-HOP TRAIL',source:'react',section:'§3.1 Action Space、§3.2 Prompting',goal:'让刚查到的信息决定下一次查什么。',terms:[['多跳问答','Multi-hop QA','回答需要连接不止一条证据。'],['search','搜索实体','论文问答环境的一种行动。'],['lookup','页面内定位','在当前页面继续找指定文本。'],['finish','完成任务','已有充分信息后提交答案。']],insight:'论文中的这组工具用于特定问答环境，不是所有 Agent 必须使用的固定 API。下方是原创微型知识库。',quiz:Q('问题是“书院创办者毕业于哪所学校？”只查到创办者名字，够了吗？',['够了，把创办者名字当作学校','不够，还要查询这个人的教育经历','不够，因此永远不能完成任务'],1,['把不同实体类型混淆了：人名不是学校名。','对。第二跳的查询目标来自第一跳的结果。','需要补充一条线索，不是放弃整个问题。']),steps:[{prompt:'任务：星港书院的创办者毕业于哪所学校？你还没有任何证据。',options:['search[星港书院]','finish[银河大学]','lookup[毕业]'],answer:0,wrong:'先确认创办者。没有当前页面时，也不能直接在页面内定位。',observation:'K1：星港书院由林岚创办。该页未列出她的教育经历。',action:'search[星港书院]'},{prompt:'已知创办者是林岚。下一步最有用的行动？',options:['search[星港天气]','finish[林岚]','search[林岚]'],answer:2,wrong:'现在缺的是创办者的学校；用人名继续查教育经历。',observation:'K2：林岚的个人档案写明，她毕业于北辰大学。',action:'search[林岚]'},{prompt:'两条证据现在已经连起来。你会提交哪份答案？',options:['finish[银河大学]，因为名字更熟悉','finish[北辰大学]，连接 K1 的创办者和 K2 的学校','继续无目的搜索，永远不结束'],answer:1,wrong:'答案必须由 K1 和 K2 共同支持；证据足够后应结束。',observation:'任务完成：星港书院 → 创办者林岚 → 北辰大学。',action:'finish[北辰大学]'}],lesson:'查公司创办者的出生地、论文作者的机构，都可能需要这种多跳过程。',transfer:'项目动作：工具结果影响下一次调用参数，而非写死所有搜索顺序。'},
 {title:'走出失败循环',short:'失败重规划',world:'ReAct',enemy:'循环石魔',time:4,tag:'07 / BREAK THE LOOP',source:'react',section:'§2、§3.2、§3.3',goal:'空结果也是反馈；合理调整后再行动。',terms:[['重规划','Replanning','根据新反馈改变下一步。'],['少样本提示','Few-shot prompting','给模型少量任务示例；不等于必须重新训练。'],['行动上限','Step budget','工程上限制调用次数，避免无限循环。'],['停止条件','Stop condition','已有答案，或信息不足且预算已耗尽时结束。']],insight:'原论文主要研究冻结模型上的提示方法，也做了微调实验。调用上限与缺证据停止是本游戏采用的工程约束。',quiz:Q('你只得到 search 的空结果。哪种处理最符合反馈驱动的行动？',['把空结果改写成想要的事实','检查名称或换查询，再决定是否结束','以相同参数无限重试'],1,['编造 Observation 会让后续每一步都建立在假证据上。','对。先修正查询策略，并遵守调用预算。','重复同一个失败操作没有利用新信息。']),steps:[{prompt:'查“北晨大学”的资料时返回：未找到，可能是“北辰大学”。仅剩 1 次搜索机会。',options:['search[北辰大学]','继续 search[北晨大学]','宣布两所学校就是同一所且无需核实'],answer:0,wrong:'工具给了可核验的拼写线索，应该修正后查询，而不是重复或直接断言。',action:'search[北辰大学]',observation:'J1：北辰大学主页已找到，但没有记载图书馆遗失赔偿金额。'},{prompt:'用户要的是遗失赔偿金额，搜索预算已用尽。如何收尾？',options:['finish[200 星币]','再次调用，忽略上限','说明当前证据不足，请补充赔偿制度'],answer:2,wrong:'预算用尽而证据不足时，不能编造金额，也不能越过限制继续调用。',action:'finish[证据不足]',observation:'已停止。没有捏造事实，也没有进入无限循环。'}],lesson:'检索故障、工具空结果、信息缺失，是实际 Agent 经常遇到的情况。',transfer:'项目动作：处理工具错误、限制循环轮数，并把不足之处告知用户。'},
 {title:'终章：知识与行动',short:'最终试炼',world:'RAG × ReAct',enemy:'迷雾档案龙',time:6,tag:'08 / THE FINAL EXPEDITION',source:'both',section:'RAG §2；ReAct §2–3；原创综合案例',goal:'把 RAG 的知识链，接进 ReAct 的行动循环。',terms:[['RAG','知识使用方式','关心怎样让检索知识参与生成。'],['ReAct','判断与行动的结合','关心行动、反馈如何帮助后续决策。'],['检索工具','Retrieval as a tool','Agent 可在需要时调用检索能力。'],['证据充分','Evidence sufficiency','本场景要求材料支持问题中的每个必要条件。']],insight:'二者可以组合，但彼此不等同。RAG 不一定需要 Agent，ReAct 也可以操作物体或网页，而不只检索文档。',quiz:Q('哪个设计准确组合了两篇论文的思想？',['所有 Agent 都必须有向量数据库，否则不是 ReAct','模型决定检索，读取资料，按返回信息继续行动或回答','只把全部资料塞进提示词，就已经完成 ReAct'],1,['ReAct 不限定向量库，也不限定工具类型。','对。知识检索与反馈驱动决策，在一个应用里结合。','这可能是上下文增强，但还没有体现行动与反馈循环。']),steps:[{prompt:'最终任务：按当前制度，学生借阅机器人需付多少押金、能借几天？',options:['凭记忆回答“100 星币，7 天”','search[机器人借阅 当前制度]','只搜索今日天气'],answer:1,wrong:'这是会随制度变化的精确信息，先查当前规则。',action:'search[机器人借阅 当前制度]',observation:'B1（旧）：押金 100 星币。B2（当前）：押金改为 200 星币；借期见《学生借阅细则》。'},{prompt:'B2 解决了押金问题，借期仍然缺失。下一步？',options:['search[学生借阅细则 机器人 借期]','直接说 7 天，借期应该不会变','只引用旧制度 B1'],answer:0,wrong:'用已有文档中的明确指向继续检索，补齐借期这个缺口。',action:'search[学生借阅细则 机器人 借期]',observation:'B3（当前细则）：学生机器人借阅期为 3 天；无本场景所需的其他金额。'},{prompt:'已拿到当前制度 B2 和细则 B3。选择能被证据支持的最终回答。',options:['200 星币，3 天，永久免费维修','100 星币，7 天，依据 B1','押金 200 星币，借期 3 天；分别依据 B2 与 B3'],answer:2,wrong:'逐项核对：金额、借期与附加承诺都必须有对应依据，且不能用已过期制度。',action:'finish[200 星币 / 3 天]',observation:'档案龙迷雾消散。你完成了一条可核验的检索与行动链。'}],lesson:'这就是我们要做的“本地知识助手”：需要时找资料，读反馈，补缺口，再有依据地结束。',transfer:'项目对应：decide → search_notes / tools → decide → final。LangGraph 编排流程；MCP 可作为后续工具连接方式。'}
];
const KEY='paper-quest-v1';
function fresh(){return {version:1,records:LEVELS.map(()=>({seen:false,quiz:false,clear:false,step:0,misses:0})),font:'standard'};}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(!o||o.version!==1||!Array.isArray(o.records)||o.records.length!==8)return fresh();const s=fresh();s.font=o.font==='large'?'large':'standard';s.records=s.records.map((r,i)=>{const a=o.records[i]||{},len=LEVELS[i].steps?.length||0,limit=a.clear===true?len:Math.max(0,len-1);return {seen:a.seen===true,quiz:a.quiz===true,clear:a.clear===true,step:Number.isInteger(a.step)?Math.max(0,Math.min(a.step,limit)):0,misses:Number.isInteger(a.misses)?Math.max(0,a.misses):0};});let locked=false;for(const r of s.records){if(locked)Object.assign(r,{seen:false,quiz:false,clear:false,step:0});if(r.clear){r.seen=true;r.quiz=true;}if(!r.clear)locked=true;}return s;}catch{return fresh();}}
let state=load(),view='home',current=0,phase='learn',feedback=null,chosen=-1,toastTimer=null,storageOK=true;
const app=document.getElementById('app'),modal=document.getElementById('modal');
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{storageOK=false;toast('浏览器阻止了存档；本次仍可玩，关闭后可能丢失进度。');}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function xp(){return state.records.reduce((sum,r)=>sum+(r.quiz?40:0)+(r.clear?60:0),0);}
function cleared(){return state.records.filter(r=>r.clear).length;}
function nextLevel(){const i=state.records.findIndex(r=>!r.clear);return i===-1?7:i;}
function unlocked(i){return i===0||state.records[i-1].clear;}
function rank(){return ['初识者','资料寻路人','检索学徒','概率观察员','证据审计员','行动学徒','线索追踪者','迷雾破局者','论文探险大师'][cleared()];}
function robot(size=110){return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="像素探险机器人"><path d="M20 86h60M26 80h48" stroke="#304c3c" stroke-width="5"/><path d="M32 59h36v24H32z" fill="#638456"/><path d="M38 62h24v18H38z" fill="#b6e880"/><path d="M28 31h44v32H28z" fill="#b6e880"/><path d="M22 38h6v17h-6m50-17h6v17h-6" fill="#789d5a"/><path d="M35 40h30v14H35z" fill="#172829"/><path d="M40 43h5v5h-5m15-5h5v5h-5" fill="#b6e880"/><path d="M45 56h10v3H45" fill="#648754"/><path d="M47 21h6v10h-6" fill="#789d5a"/><path d="M43 16h14v8H43" fill="#f1ce83"/><path d="M24 65h8v17h-8m44-17h8v17h-8" fill="#789d5a"/><path d="M36 83h10v8H32v-5m22-3h10v3h4v5H54" fill="#b6e880"/></svg>`;}
function monster(i){const hue=i<4?'#c8a76b':'#78b8ae';return `<svg viewBox="0 0 80 80" role="img" aria-label="${esc(LEVELS[i].enemy)}"><path d="M10 65h60" stroke="#344742" stroke-width="4"/><path d="M18 28h8v-8h10v-5h16v8h9v10h7v27H13V39h5z" fill="${hue}"/><path d="M19 56h42v8H19" fill="#0003"/><path d="M27 35h9v10h-9m16-10h9v10h-9" fill="#142123"/><path d="M29 35h3v3h-3m16-3h3v3h-3" fill="#fff"/><path d="M35 50h10v4H35" fill="#142123"/><path d="M13 49H6v10h10m50-10h8v10H63" fill="${hue}"/>${i===7?'<path d="M19 26L9 12l21 10m25 0L72 12 62 33" fill="#f1ce83"/>':''}</svg>`;}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,3500);}
function applyFont(){document.documentElement.style.setProperty('--body',state.font==='large'?'17px':'15px');document.documentElement.classList.toggle('large',state.font==='large');let st=document.getElementById('largefont');if(!st){st=document.createElement('style');st.id='largefont';document.head.append(st);}st.textContent=state.font==='large'?'.panel p,.term p,.option,.doc,.traceentry,.labintro,.feedback{font-size:15px}.term b{font-size:16px}.panel .source,.choicehint{font-size:12px}':'';}
function goHome(){view='home';feedback=null;chosen=-1;render();window.scrollTo({top:0,behavior:'instant'});}
function enterLevel(i){if(!unlocked(i)){toast('先完成上一关的考察与场景，即可解锁。');return;}current=i;view='level';const r=state.records[i];phase=r.clear?'learn':!r.seen?'learn':!r.quiz?'quiz':'scene';feedback=null;chosen=-1;render();window.scrollTo({top:0,behavior:'instant'});}
function setPhase(p){const r=state.records[current];if(p==='quiz'&&!r.seen){toast('先读名词卡，再点击“我懂了”。');return;}if(p==='scene'&&!r.quiz){toast('先完成小考察，场景挑战就会解锁。');return;}phase=p;feedback=null;chosen=-1;renderLevel();}
function render(){applyFont();if(view==='home')renderHome();else renderLevel();}
function renderHome(){const n=nextLevel(),done=cleared(),l=LEVELS[n];app.innerHTML=`<section class="hero"><div><div class="eyebrow">RAG × ReAct / 经典论文冒险计划</div><h1>把论文，<em>玩明白。</em></h1><p>穿过知识森林，启动行动引擎。用 8 个小关卡，<br>把“看过论文”变成“知道怎么用”。</p><span class="pill"><span class="dot"></span>每关：名词理解 → 小考察 → 场景应用</span></div><div class="hero-figure">${robot()}<div><span class="muted" style="font-size:10px;letter-spacing:2px">EXPLORER PROFILE</span><strong>${rank()}</strong><span class="mono muted" style="font-size:12px">LV.${Math.min(9,Math.floor(xp()/100)+1)} / ${xp()} XP</span><div class="progressline"><span>探索进度</span><span>${done}/8</span></div><div class="bar"><span style="width:${done/8*100}%"></span></div></div></div></section><section class="dashboard" aria-label="探险地图"><div class="card"><div class="maphead"><h2>你的论文探险地图</h2><div class="legend"><span style="color:var(--green)">● 可挑战</span><span>◇ 待解锁</span></div></div><div class="map"><span class="zone a">CHAPTER I · 知识森林 / RAG</span><svg class="route" viewBox="0 0 700 380" preserveAspectRatio="none" aria-hidden="true"><path d="M84 102C140 102 150 121 231 121S337 83 392 83S495 121 567 121C680 121 668 264 567 264S465 294 392 294S303 255 231 255S133 290 84 290" fill="none" stroke="#3d5551" stroke-width="3" stroke-dasharray="6 8"/><path d="M41 177l10-18 10 18h-7v13h-6v-13m574 4l10-18 10 18h-7v13h-6v-13m-483 155l9-15 9 15h-6v11h-6v-11" fill="#3a564466"/></svg>${LEVELS.map((v,i)=>{const coords=[[12,27],[33,32],[56,22],[81,32],[81,70],[56,78],[33,67],[12,76]][i];const r=state.records[i];return `<button class="mapnode ${r.clear?'done':i===n?'current':unlocked(i)?'':'locked'}" style="left:${coords[0]}%;top:${coords[1]}%" onclick="enterLevel(${i})" aria-label="第 ${i+1} 关 ${v.title}，${r.clear?'已完成':unlocked(i)?'可挑战':'待解锁'}"><span class="nodecircle">${r.clear?'✓':unlocked(i)?String(i+1).padStart(2,'0'):'◇'}</span><span class="nlabel">${v.short}</span><span class="nsub">${i===7?'FINAL BOSS':v.world+' / '+v.time+' MIN'}</span></button>`;}).join('')}<span class="zone b">CHAPTER II · 行动遗迹 / ReAct</span></div><div class="map-foot"><span>路线按学习依赖解锁；通关后可反复复习。</span><span>${done===8?'全境探索完成 ✓':'下个目标：'+String(n+1).padStart(2,'0')}</span></div></div><aside class="card mission"><div class="tiny">${done===8?'EXPEDITION COMPLETE':'YOUR NEXT MISSION'}</div><h2>${done===8?'大师，欢迎归来。':l.title}</h2><p>${done===8?'你已打通知识与行动的连接。回看任意关卡，或者导出你的学习战报。':l.goal}</p><ul><li>${done===8?'8 关全部击破':'4 张名词卡'}</li><li>${done===8?'800 XP 已获得':'1 道概念小考'}</li><li>${done===8?'可回看所有实验':'1 个场景挑战'}</li></ul><div style="margin:5px 0 21px;display:flex;align-items:center;gap:15px">${monster(n)}<div><span class="muted" style="font-size:10px">${done===8?'已击败最终首领':'本关守卫'}</span><br><strong style="font-size:14px">${done===8?'迷雾档案龙':l.enemy}</strong><br><span class="tag">${done===8?'全部解锁':'通关 +100 XP'}</span></div></div><button class="btn" onclick="${done===8?'showCertificate()':`enterLevel(${n})`}">${done===8?'查看通关战报':'继续探险'} <span>→</span></button><div class="meta">${storageOK?'自动本地存档':'当前浏览器无法持久存档'} · 错了可重试，不扣经验</div></aside></section><section class="stats" aria-label="学习统计"><div class="stat"><span class="stat-icon">◈</span><div><strong>${done}<span style="font-size:13px;color:var(--muted)"> / 8</span></strong><small>关卡已通关</small></div></div><div class="stat"><span class="stat-icon">✧</span><div><strong>${xp()}<span style="font-size:13px;color:var(--muted)"> XP</span></strong><small>理解，比背诵更重要</small></div></div><div class="stat"><span class="stat-icon">◷</span><div><strong>35–45<span style="font-size:13px;color:var(--muted)"> 分钟</span></strong><small>建议游玩时长 · 可中途退出</small></div></div></section><div class="paper-row"><span>学术坐标</span><a href="${PAPERS.rag.url}" target="_blank" rel="noopener">RAG · NeurIPS 2020 ↗</a><span>＋</span><a href="${PAPERS.react.url}" target="_blank" rel="noopener">ReAct · ICLR 2023 ↗</a><span>所有工具反馈均为离线教学模拟，不调用真实大模型。</span></div>`;}
function sourceLine(l){return `<div class="source">论文定位：${l.section} · ${l.source==='both'?`<a href="${PAPERS.rag.url}" target="_blank" rel="noopener">RAG</a> + <a href="${PAPERS.react.url}" target="_blank" rel="noopener">ReAct</a>`:`<a href="${PAPERS[l.source].url}" target="_blank" rel="noopener">${PAPERS[l.source].name} ↗</a>`}</div>`;}
function renderLevel(){const l=LEVELS[current],r=state.records[current];app.innerHTML=`<div class="workbar"><button class="btn secondary" onclick="goHome()">← 探险地图</button><span class="pill">${rank()} <span class="mono">${xp()} XP</span></span></div><div class="workspace"><aside class="side"><div class="side-title">EXPEDITION LOG / 关卡</div><div class="sidelist">${LEVELS.map((s,i)=>`<button class="sideitem ${i===current?'on':''} ${!unlocked(i)?'locked':''}" onclick="enterLevel(${i})" aria-current="${i===current?'step':'false'}"><span class="num">${state.records[i].clear?'✓':String(i+1).padStart(2,'0')}</span><span><strong>${s.short}</strong><small>${s.world} · ${unlocked(i)?s.time+' 分钟':'待解锁'}</small></span></button>`).join('')}</div><div class="side-bottom"><div class="progressline"><span>整段旅程</span><span>${cleared()}/8</span></div><div class="bar"><span style="width:${cleared()/8*100}%"></span></div><p style="margin-top:12px">答错不是终点。<br>读懂反馈，再试一次。</p></div></aside><div><div class="stagehead"><div><div class="eyebrow" style="margin-bottom:7px">${l.tag}</div><h1>${l.title}</h1><p>${l.goal}</p></div><div class="enemy">${monster(current)}<div><span class="title">LEVEL GUARDIAN</span><br><strong>${l.enemy}</strong><div class="bar"><span style="width:${r.clear?0:r.quiz?50:100}%"></span></div><small class="muted" style="font-size:9px">护盾 ${r.clear?0:r.quiz?1:2} / 2</small></div></div></div><div class="steps" aria-label="关卡学习步骤"><button class="tab ${phase==='learn'?'active':''} ${r.seen?'done':''}" onclick="setPhase('learn')"><small>01</small> 名词理解 ${r.seen?'✓':''}</button><button class="tab ${phase==='quiz'?'active':''} ${r.quiz?'done':''}" onclick="setPhase('quiz')"><small>02</small> 小考察 ${r.quiz?'✓':''}</button><button class="tab ${phase==='scene'?'active':''} ${r.clear?'done':''}" onclick="setPhase('scene')"><small>03</small> 场景应用 ${r.clear?'✓':''}</button></div><section class="card panel" id="stagePanel" aria-label="当前关卡内容">${phase==='learn'?renderLearn(l,r):phase==='quiz'?renderQuiz(l,r):renderScene(l,r)}</section></div></div>`;if(current===2&&phase==='scene'&&!r.clear)updateProbability();}
function renderLearn(l,r){return `<span class="tag">知识装备 / ${l.world}</span><h2 style="margin-top:13px">先获得这 4 件装备</h2><p class="lead">先理解名词，再去击破守卫的护盾。随时可回看。</p><div class="terms">${l.terms.map(t=>`<div class="term"><b>${t[0]}</b><span class="en">${t[1]}</span><p>${t[2]}</p></div>`).join('')}</div><div class="insight"><b>容易混淆的地方</b><br>${l.insight}</div>${sourceLine(l)}<div class="actionrow"><button class="btn" onclick="acknowledge()">${r.seen?'进入小考察':'我懂了，进入小考察'} →</button><span class="muted" style="font-size:11px">不用背定义，能分清职责就好。</span></div>`;}
function acknowledge(){state.records[current].seen=true;save();phase='quiz';feedback=null;chosen=-1;renderLevel();}
function optionsMarkup(q,mode,done){return `<div class="options">${q.options.map((t,i)=>`<button class="option ${chosen===i?(feedback?.ok?'chosen':'bad'):''}" onclick="${mode}(${i})" ${done?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(t)}</span></button>`).join('')}</div>`;}
function feedbackMarkup(){if(!feedback)return '';return `<div class="feedback ${feedback.ok?'':'wrong'}" role="status"><strong>${feedback.ok?'命中要点，护盾削弱！':'再想一想，你离答案很近了。'}</strong><p>${esc(feedback.text)}</p></div>`;}
function renderQuiz(l,r){return `<span class="tag">第一层护盾 / +40 XP</span><h2 style="margin-top:13px">概念小考察</h2><p class="lead">选最符合论文思想的一项。答错会给提示，不扣经验。</p><div class="question">${l.quiz.text}</div>${optionsMarkup(l.quiz,'answerQuiz',r.quiz)}${feedbackMarkup()}${r.quiz?`<div class="feedback"><strong>小考察已通过 ✓</strong><p>概念已到位。接下来，把它用到场景中。</p></div><div class="actionrow"><button class="btn" onclick="setPhase('scene')">进入场景挑战 →</button><button class="btn secondary" onclick="setPhase('learn')">回看名词</button></div>`:`<div class="choicehint">选项点击即提交；可回到“名词理解”找线索。</div>`}${sourceLine(l)}`;}
function answerQuiz(i){const r=state.records[current];if(!r.seen||r.quiz)return;const q=LEVELS[current].quiz;chosen=i;feedback={ok:i===q.answer,text:q.explain[i]};if(i===q.answer){r.quiz=true;save();toast('+40 XP · 第一层护盾已击破');}else{r.misses++;save();}renderLevel();}
const DOCS=[{id:'D1',text:'星港图书馆 开放 时间 09:00 至 20:00。',keys:['图书馆','开放','时间']},{id:'D2',text:'学生借阅机器人时，须出示学生卡。',keys:['机器人','借阅','学生','证件']},{id:'D3',text:'机器人借阅须缴纳 200 星币押金。',keys:['机器人','借阅','押金','费用']},{id:'D4',text:'食堂每周推出新菜单。',keys:['食堂','菜单']}];
function labMarkup(){if(current===0)return `<div class="laboratory"><div class="labtitle">CASE FILE / 虚构公告库</div><div class="docs"><div class="doc"><b>A1 · 已被替代的旧公告</b>星港图书馆每天 18:00 关闭。</div><div class="doc"><b>A2 · 当前有效公告</b>即日起，星港图书馆关闭时间延长到 20:00。</div></div><div class="pipeline"><span class="pipe">用户问题</span><span class="arrow">→</span><span class="pipe em">检索当前公告</span><span class="arrow">→</span><span class="pipe">依据片段回答</span></div></div>`;
if(current===1)return `<div class="laboratory"><div class="labtitle">RETRIEVAL LAB / 真实执行的本地关键词检索</div><p class="labintro">试试“机器人 押金”与“食堂 菜单”。按命中关键词数排序，分数相同按文档编号排列。不是向量模型。</p><form class="lab-controls" onsubmit="event.preventDefault();runSearch()"><input id="searchQuery" class="searchinput" aria-label="检索关键词" value="机器人 押金" maxlength="100"><label class="muted" style="font-size:11px">Top-K <select id="topK" aria-label="Top-K 数量"><option>1</option><option selected>2</option><option>3</option></select></label><button class="btn" type="submit">运行检索</button></form><div id="searchResults" aria-live="polite"><div class="empty">点击“运行检索”，查看实际命中与分数。</div></div></div>`;
if(current===2)return `<div class="laboratory"><div class="labtitle">PROBABILITY LAB / 两文档、两词元的玩具计算</div><p class="labintro">目标答案含两个 token。在固定目标前缀下，A 的两个条件概率为 0.9、0.1；B 为 0.1、0.9。滑动 A 的检索权重，B 的权重为 1−A。</p><label style="font-size:12px">文档 A 权重：<strong id="weightLabel">0.50</strong><br><input id="probWeight" type="range" min="0" max="100" value="50" oninput="updateProbability()" aria-label="文档 A 的检索权重"></label><div class="numbers"><div class="numbertile"><label>RAG-Sequence</label><strong id="seqValue">0.090</strong><small>先乘，再按文档加权</small></div><div class="numbertile"><label>RAG-Token</label><strong id="tokValue">0.250</strong><small>每位置先混合，再连乘</small></div></div><div class="formula" style="margin-top:13px">Sequence = w × 0.9 × 0.1 + (1−w) × 0.1 × 0.9<br>Token = [w × 0.9 + (1−w) × 0.1] × [w × 0.1 + (1−w) × 0.9]</div></div>`;
if(current===3)return `<div class="laboratory"><div class="labtitle">AUDIT FILE / 故意不完整的证据</div><div class="doc"><b>E1 · 当前命中</b>学生可外借机器人，办理时需要学生卡。</div><p class="labintro" style="margin:12px 0 0">这段证据没有记载遗失赔偿金额。不要把“相关”误认为“足够”。</p></div>`;
if(current===4)return `<div class="laboratory"><div class="labtitle">ACTION LOG / 手写教学轨迹</div><div class="trace"><div class="traceentry"><span class="kind">判断摘要</span><p>目标是把书放到有空位的书架。</p></div><div class="traceentry"><span class="kind">Action</span><p>inspect_shelf[书架 A]</p></div><div class="traceentry"><span class="kind">Observation</span><p>书架 A 已满，没有可用空位。</p></div></div></div>`;return '';}
function renderScene(l,r){if(r.clear)return renderCleared(l);if(l.steps){const s=l.steps[r.step];return `<span class="tag">第二层护盾 / 完成后 +60 XP</span><h2 style="margin-top:13px">${current===7?'最终首领战':'场景行动挑战'}</h2><p class="lead">${l.lesson}</p><div class="laboratory"><div class="labtitle">OFFLINE SIMULATOR / 预设工具世界 · 非真实模型调用</div><div class="battlecount">行动 ${r.step+1} / ${l.steps.length}</div>${r.step?`<div class="trace">${l.steps.slice(0,r.step).map(s=>`<div class="traceentry"><span class="kind">Action</span><p>${esc(s.action)}</p></div><div class="traceentry"><span class="kind">Observation</span><p>${esc(s.observation)}</p></div>`).join('')}</div>`:'<div class="empty">暂无观察记录。选择一个行动，世界才会返回反馈。</div>'}</div><div class="question">${s.prompt}</div>${optionsMarkup({options:s.options},'answerStep',false)}${feedbackMarkup()}<div class="choicehint">正确行动会推进环境；错误行动会解释原因，允许重试。</div>${sourceLine(l)}`;}
return `<span class="tag">第二层护盾 / +60 XP</span><h2 style="margin-top:13px">把概念用起来</h2><p class="lead">${l.lesson}</p>${labMarkup()}<div class="question">${l.scenario.text}</div>${optionsMarkup(l.scenario,'answerScene',false)}${feedbackMarkup()}${sourceLine(l)}`;}
function answerScene(i){const r=state.records[current];if(!r.quiz||r.clear)return;const q=LEVELS[current].scenario;chosen=i;if(i===q.answer){completeLevel(q.explain[i]);return;}r.misses++;feedback={ok:false,text:q.explain[i]};save();renderLevel();}
function answerStep(i){const r=state.records[current],l=LEVELS[current];if(!r.quiz||r.clear)return;const s=l.steps[r.step];chosen=i;if(i!==s.answer){r.misses++;feedback={ok:false,text:s.wrong};save();renderLevel();return;}r.step++;save();if(r.step===l.steps.length){completeLevel(s.observation);return;}feedback={ok:true,text:s.observation};chosen=-1;renderLevel();toast('行动生效 · 已收到新的观察');}
function completeLevel(msg){const r=state.records[current];if(r.clear)return;r.clear=true;r.win=msg;save();feedback=null;chosen=-1;renderLevel();toast('+60 XP · 守卫已击破，新路线已解锁！');}
function renderCleared(l){const r=state.records[current];return `<div class="summary celebrate"><div class="trophy">${robot(90)}</div><div class="eyebrow" style="margin:15px 0 4px">LEVEL CLEARED</div><h2>${l.enemy}，击破！</h2><div class="reward">100 XP</div><p>本关累计奖励 · 重复复习不会重复计分</p></div><div class="insight"><b>你现在能把它用在这里</b><br>${l.transfer}</div><div class="doc"><b>通关结论</b>${esc(l.steps?l.steps[l.steps.length-1].observation:l.scenario.explain[l.scenario.answer])}</div>${l.steps?`<details style="margin-top:15px"><summary style="cursor:pointer;color:var(--mint);font-size:12px">回看本关完整行动轨迹</summary><div class="trace">${l.steps.map(s=>`<div class="traceentry"><span class="kind">Action</span><p>${esc(s.action)}</p></div><div class="traceentry"><span class="kind">Observation</span><p>${esc(s.observation)}</p></div>`).join('')}</div></details>`:''}<div class="actionrow">${current<7?`<button class="btn" onclick="enterLevel(${current+1})">前往第 ${current+2} 关 →</button>`:'<button class="btn" onclick="showCertificate()">领取最终战报 →</button>'}<button class="btn secondary" onclick="reviewScene()">重玩本关场景</button><button class="quiet" onclick="setPhase('learn')">复习名词</button></div>${sourceLine(l)}`;}
function reviewScene(){const l=LEVELS[current];openDialog('场景复习 · 不改变通关成绩',`<p class="lead">${l.lesson}</p>${l.steps?l.steps.map((s,i)=>`<div class="paper"><b>步骤 ${i+1}：${s.prompt}</b><p>${esc(s.options[s.answer])}<br>${esc(s.observation)}</p></div>`).join(''):`<div class="paper"><h3>${l.scenario.text}</h3><p>${esc(l.scenario.options[l.scenario.answer])}<br>${esc(l.scenario.explain[l.scenario.answer])}</p></div>`}<button class="btn secondary" onclick="startPractice()">开始互动重练</button>`);}
let practice=null;
function startPractice(){practice={i:current,step:0};renderPractice();}
function renderPractice(note=''){const l=LEVELS[practice.i],s=l.steps?l.steps[practice.step]:l.scenario;openDialog('互动重练 · 不重复计分',`<p class="lead">${l.steps?'行动 '+(practice.step+1)+' / '+l.steps.length:l.title}</p><h3>${s.prompt||s.text}</h3><div class="options">${s.options.map((v,i)=>`<button class="option" onclick="practiceAnswer(${i})"><span class="letter">${String.fromCharCode(65+i)}</span>${esc(v)}</button>`).join('')}</div>${note?`<div class="feedback wrong" role="status">${esc(note)}</div>`:''}`);}
function practiceAnswer(i){const l=LEVELS[practice.i],s=l.steps?l.steps[practice.step]:l.scenario;if(i!==s.answer){renderPractice(l.steps?s.wrong:s.explain[i]);return;}if(l.steps&&practice.step<l.steps.length-1){practice.step++;renderPractice();return;}openDialog('复习完成',`<div class="summary"><h2>理解再加固一次。</h2><p>${l.transfer}</p><button class="btn" onclick="closeModal()">回到关卡</button></div>`);practice=null;}
function runSearch(){const q=document.getElementById('searchQuery').value.trim().slice(0,100),k=Number(document.getElementById('topK').value);const out=document.getElementById('searchResults');if(!q){out.innerHTML='<div class="empty">请输入关键词，例如“机器人 押金”。</div>';return;}const ranked=DOCS.map(d=>({...d,score:d.keys.filter(w=>q.includes(w)).length})).filter(d=>d.score>0).sort((a,b)=>b.score-a.score||a.id.localeCompare(b.id)).slice(0,k);out.innerHTML=ranked.length?`<div class="results-title">命中 ${ranked.length} 条 · 关键词计分 / 非 DPR</div><div class="docs">${ranked.map(d=>`<div class="doc"><b>${d.id} · 得分 ${d.score}</b>${esc(d.text)}</div>`).join('')}</div>`:'<div class="empty">没有正分命中。试试“机器人”“押金”或“菜单”。</div>';}
function updateProbability(){const input=document.getElementById('probWeight');if(!input)return;const w=Number(input.value)/100;document.getElementById('weightLabel').textContent=w.toFixed(2);document.getElementById('seqValue').textContent=(w*.9*.1+(1-w)*.1*.9).toFixed(3);document.getElementById('tokValue').textContent=((w*.9+(1-w)*.1)*(w*.1+(1-w)*.9)).toFixed(3);}
function openDialog(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;if(!modal.open)modal.showModal();modal.scrollTop=0;}
function closeModal(){modal.close();}
modal.addEventListener('click',e=>{if(e.target===modal){const b=modal.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)closeModal();}});
function openGlossary(){openDialog('术语图鉴',`<p class="lead">${cleared()} / 8 关完成。所有名词均可查阅，关卡仍需逐一挑战。</p><div class="searchwrap"><input class="searchinput" aria-label="搜索术语" placeholder="搜索中文或英文，如 Observation" oninput="filterGlossary(this.value)"></div><div class="glossary" id="glossaryResults"></div>`);filterGlossary('');}
function filterGlossary(v){const list=LEVELS.flatMap((l,i)=>l.terms.map(t=>({t,i}))).filter(o=>o.t.join(' ').toLowerCase().includes(v.toLowerCase()));document.getElementById('glossaryResults').innerHTML=list.length?list.map(o=>`<div class="term"><b>${o.t[0]}</b><span class="en">${o.t[1]} · 关卡 ${o.i+1}</span><p>${o.t[2]}</p></div>`).join(''):'<div class="empty">没有匹配术语。试试另一个关键词。</div>';}
function openPapers(){openDialog('这次冒险的两篇原文',`<div class="paper"><span class="tag">CHAPTER I / RAG</span><h3 style="margin-top:14px">Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks</h3><p>Patrick Lewis 等 · NeurIPS 2020<br>重点：§2 方法；§2.1 两种模型；§2.4 训练。原论文包含稠密检索与模型微调，本游戏不会训练模型。</p><div class="paperlinks"><a href="${PAPERS.rag.url}" target="_blank" rel="noopener">论文主页 ↗</a><a href="${PAPERS.rag.pdf}" target="_blank" rel="noopener">原文 PDF ↗</a></div></div><div class="paper"><span class="tag">CHAPTER II / ReAct</span><h3 style="margin-top:14px">ReAct: Synergizing Reasoning and Acting in Language Models</h3><p>Shunyu Yao 等 · 2022 年预印本 / ICLR 2023<br>重点：图 1；§2 思想；§3.1 问答环境；§3.2 提示方法。不是每项任务都必须机械套用固定三步节奏。</p><div class="paperlinks"><a href="${PAPERS.react.url}" target="_blank" rel="noopener">论文主页 ↗</a><a href="${PAPERS.react.pdf}" target="_blank" rel="noopener">原文 PDF ↗</a></div></div><div class="insight"><b>教学边界</b><br>关卡文本为中文原创讲解；场景、分数和怪物均为虚构。检索实验使用关键词；多跳行动使用预设工具结果。概率实验是手工给定条件概率的精确计算，不是运行 DPR / BART。引用、拒答与循环上限是教学工程练习，不是论文的全部贡献或保证。</div><p class="lead">对应项目：<a href="https://github.com/langchain-ai/react-agent" target="_blank" rel="noopener">langchain-ai/react-agent ↗</a><br>原文核对：2026-10-22。</p>`);}
function openSettings(){openDialog('探险设置',`<div class="setting"><span>阅读字号</span><select aria-label="阅读字号" onchange="changeFont(this.value)"><option value="standard" ${state.font==='standard'?'selected':''}>标准</option><option value="large" ${state.font==='large'?'selected':''}>大字</option></select></div><div class="setting"><span>学习记录<br><small class="muted">下载纯文本战报，不包含个人信息。</small></span><button class="btn secondary" onclick="exportReport()" style="font-size:11px;padding:8px 12px">导出战报</button></div><div class="setting"><span>重新开始<br><small class="muted">将清除本浏览器里的全部关卡记录。</small></span><button class="quiet" style="color:var(--red)" onclick="askReset()">重置进度</button></div><p class="lead" style="margin:20px 0 0">游戏不调用 API，不发送学习记录。进度保存在当前浏览器；更换设备、清除网站数据或使用无痕模式，存档可能不会保留。</p>`);}
function changeFont(v){state.font=v;save();applyFont();toast('阅读字号已更新');}
function askReset(){openDialog('确认重置进度？',`<p>这会清除 8 个关卡的成绩、解锁与经验值。论文和关卡内容仍然保留。</p><div class="actionrow"><button class="btn secondary" onclick="openSettings()">保留进度</button><button class="btn" onclick="resetProgress()">清除并重新开始</button></div>`);}
function resetProgress(){state=fresh();save();closeModal();goHome();toast('新的探险开始了。');}
function reportText(){return `论文探险者 · RAG × ReAct 学习战报\n身份：${rank()}\n完成：${cleared()}/8 关\n经验：${xp()}/800 XP\n\n`+LEVELS.map((l,i)=>`${state.records[i].clear?'[已完成]':'[待完成]'} ${i+1}. ${l.title}\n带走的能力：${l.transfer}\n考察与场景累计重试：${state.records[i].misses}`).join('\n\n')+`\n\n原文\nRAG: ${PAPERS.rag.url}\nReAct: ${PAPERS.react.url}\n\n这是离线学习模拟，不代表已训练或部署真实 Agent。`;}
function exportReport(){const blob=new Blob(['\ufeff'+reportText()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Paper-Quest-学习战报.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('学习战报已导出');}
function showCertificate(){if(cleared()!==8){toast('完成全部 8 关后，就能领取最终战报。');return;}openDialog('探险完成 · 论文探险大师',`<div class="summary"><div class="trophy">${robot(90)}</div><h2>你打通了知识与行动。</h2><div class="reward">800 XP</div><p>八个守卫全部击破。下一步，把这条证据链写进你的项目。</p></div><div class="certskills"><div>✓ 分清参数知识与外部文档</div><div>✓ 检查检索与生成的分工</div><div>✓ 区分两种 RAG 概率组合</div><div>✓ 判断证据是否真的充分</div><div>✓ 区分判断、行动和观察</div><div>✓ 沿工具反馈完成多跳查询</div><div>✓ 处理空结果与调用预算</div><div>✓ 组合 RAG 与 ReAct 循环</div></div><div class="actionrow"><button class="btn" onclick="exportReport()">导出我的战报 ↓</button><button class="btn secondary" onclick="closeModal();goHome()">返回地图复习</button></div><p class="lead" style="margin-top:18px">本次是概念与场景训练。真正复现论文，还需要实现模型、训练与原论文评测。</p>`);}
render();
</script>
</body>
</html>
